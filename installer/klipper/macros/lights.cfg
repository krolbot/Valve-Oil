# VO_LIGHT_EFFECT runs the RGB light's effects through QIDI's neopixel module
# (NEOPIXEL_MODE and NEOPIXEL_ENABLE, klipper/klippy/extras/neopixel.py). The
# effect runs on the main board, and QIDI's module reports only the colors last
# set with SET_LED, so this macro's variables are what Valve Oil UI shows. They
# go back to status when Klipper restarts, as QIDI's module turns its own status
# light back on then. See docs/valve-oil-ui.md.

[gcode_macro VO_LIGHT_EFFECT]
description: Sets the RGB light's effect: EFFECT=status|off|on|solid|breathe|flow|rainbow|comet|spread|flash, RED= GREEN= BLUE= (0-255), BRIGHTNESS= (0-100), SPEED=slow|normal|fast, DIRECTION=0|1.
variable_effect: "status"
variable_last_effect: "status"
variable_red: 255
variable_green: 255
variable_blue: 255
variable_brightness: 100
variable_speed: "normal"
variable_direction: 1
gcode:
  # QIDI's mode number, its period in ms at normal speed, and its tick in ms
  {% set modes = {"solid": [1, 0, 0], "breathe": [2, 5000, 20], "flow": [3, 3000, 20], "rainbow": [4, 6000, 40], "flash": [5, 1000, 125], "comet": [6, 1500, 30], "spread": [7, 3000, 40]} %}
  {% set speeds = {"slow": 2.0, "normal": 1.0, "fast": 0.5} %}
  {% set new_effect = params.EFFECT|default(effect)|string|lower %}
  {% if new_effect == "on" %}
    {% set new_effect = last_effect %}
  {% endif %}
  {% set new_speed = params.SPEED|default(speed)|string|lower %}
  {% if new_effect not in modes and new_effect not in ["status", "off"] %}
    {action_raise_error("VO_LIGHT_EFFECT: EFFECT must be status, off, on, solid, breathe, flow, rainbow, comet, spread, or flash")}
  {% elif new_speed not in speeds %}
    {action_raise_error("VO_LIGHT_EFFECT: SPEED must be slow, normal, or fast")}
  {% else %}
    {% set new_red = [[params.RED|default(red)|int, 0]|max, 255]|min %}
    {% set new_green = [[params.GREEN|default(green)|int, 0]|max, 255]|min %}
    {% set new_blue = [[params.BLUE|default(blue)|int, 0]|max, 255]|min %}
    {% set new_brightness = [[params.BRIGHTNESS|default(brightness)|int, 0]|max, 100]|min %}
    {% set new_direction = 1 if params.DIRECTION|default(direction)|int else 0 %}
    {% if new_effect == "status" %}
      NEOPIXEL_ENABLE ENABLE=1
    {% else %}
      # Stops QIDI's status light, which would replace the effect at the next print start; this also turns the light off.
      NEOPIXEL_ENABLE ENABLE=0
      {% if new_effect != "off" %}
        {% set mode = modes[new_effect] %}
        {% set scale = new_brightness / 100.0 %}
        {% set color = [255, 255, 255] if new_effect == "rainbow" else [new_red, new_green, new_blue] %}
        NEOPIXEL_MODE M={mode[0]} RED={(color[0] * scale)|round|int} GREEN={(color[1] * scale)|round|int} BLUE={(color[2] * scale)|round|int} DIR={new_direction}{" PERIOD=%d TICK=%d" % ((mode[1] * speeds[new_speed])|round|int, mode[2]) if mode[1] else ""}
      {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=effect VALUE='"{new_effect}"'
    {% if new_effect != "off" %}
      SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=last_effect VALUE='"{new_effect}"'
    {% endif %}
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=red VALUE={new_red}
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=green VALUE={new_green}
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=blue VALUE={new_blue}
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=brightness VALUE={new_brightness}
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=speed VALUE='"{new_speed}"'
    SET_GCODE_VARIABLE MACRO=VO_LIGHT_EFFECT VARIABLE=direction VALUE={new_direction}
  {% endif %}
