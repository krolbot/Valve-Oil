# Valve Oil's cancel/error handling

# Sets the idle timeout PAUSE leaves to vo_pause_timeout_hours (72 by default,
# as QIDI's), and cancels a paused print when that idle timeout runs out.

[vo_pause_timeout]

[gcode_macro VO_CANCEL_PRINT_ON_ERROR]
description: Cancels a failed virtual-sd print without parking or moving the toolhead.
gcode:
  {action_respond_info("Print error: cancelling without parking the toolhead.")}
  SET_GCODE_VARIABLE MACRO=_print_end_inner VARIABLE=cancelled VALUE="{True}"
  M104 S0
  M140 S0
  M141 S0
  VO_DISABLE_BOX_HEATER
  M107
  M106 P2 S0
  M106 P3 S0
  M106 P4 S0
  {% if printer.pause_resume.is_paused %}
    RESTORE_GCODE_STATE NAME=_KM_PAUSE_OVERRIDE_STATE MOVE=0
  {% endif %}
  G31
  CLEAR_PAUSE
  _KM_CANCEL_PRINT_BASE

# Replaces QIDI's CANCEL_PRINT, which the installer removes from
# klipper-macros-qd/pause_resume_cancel.cfg. QIDI's left the nozzle heating
# through its slow lift to Z200 and turned it off only in PRINT_END. This turns
# the nozzle off and the part fan to full first, then drops the bed and moves
# the toolhead to the waste chute (_VO_CANCEL_PARK), and keeps the part fan on
# after the cancel until the nozzle is below fan_off_below.

[gcode_macro CANCEL_PRINT]
description: Cancels the current print.
  Usage: CANCEL_PRINT
rename_existing: _KM_CANCEL_PRINT_BASE
gcode:
  _KM_CHECK_IS_PRINTING
  SET_PRINT_MAIN_STATUS MAIN_STATUS=cancelling
  SET_GCODE_VARIABLE MACRO=_print_end_inner VARIABLE=cancelled VALUE="{True}"
  _VO_CANCEL_COOLDOWN
  _VO_CANCEL_PARK
  PRINT_END
  SET_GCODE_VARIABLE MACRO=_VO_CANCEL_COOLDOWN VARIABLE=holding VALUE=0
  M106 P2 S0
  M106 P3 S0
  M106 P4 S0
  {% if printer.pause_resume.is_paused %}
    RESTORE_GCODE_STATE NAME=_KM_PAUSE_OVERRIDE_STATE MOVE=0
  {% endif %}
  CLEAR_PAUSE
  # Last: QIDI's cancel stops every running G-code script, this one included.
  _KM_CANCEL_PRINT_BASE

# Where a cancel leaves the toolhead. It goes by the axes Klipper has homed,
# not QIDI's _HOME_STATE flag, which only QIDI's Z homing sets. After QIDI's
# power-loss resume X, Y, and Z are homed but the flag is 0, and QIDI's park
# left the nozzle on the print. It never homes, so an axis that isn't homed
# isn't moved. The bed drop is a relative move capped at Z's travel, so the
# G-code offset doesn't matter. Without Z homed, the toolhead goes to the
# chute at its height.

[gcode_macro _VO_CANCEL_PARK]
description: Drops the bed 20 mm when Z is homed, then moves the toolhead to the waste chute when X and Y are homed; never homes.
gcode:
  {% set th = printer.toolhead %}
  {% set drop = [20.0, th.axis_maximum.z - th.position.z]|min %}
  SAVE_GCODE_STATE NAME=vo_cancel_park_state
  {% if 'z' in th.homed_axes and drop > 0 %}
    G91
    G1 Z{drop} F600
  {% endif %}
  {% if 'x' in th.homed_axes and 'y' in th.homed_axes %}
    _VO_CHUTE_APPROACH
  {% endif %}
  RESTORE_GCODE_STATE NAME=vo_cancel_park_state

# Turns the nozzle off and, while it is at or above fan_off_below, the part fan
# to full until _vo_cancel_cooldown_check finds it below. While holding, through
# the cancel's PRINT_END, M107 leaves the part fan on.

[gcode_macro _VO_CANCEL_COOLDOWN]
description: Turns the nozzle off and keeps the part fan at full until the nozzle cools below fan_off_below.
variable_fan_off_below: 170
variable_holding: 0
variable_active: 0
gcode:
  {% set cooldown = printer["gcode_macro _VO_CANCEL_COOLDOWN"] %}
  M104 S0
  {% if printer[printer.toolhead.extruder].temperature|float >= cooldown.fan_off_below|float %}
    # M106 ends any earlier cooldown; this one starts after it.
    M106 S255
    SET_GCODE_VARIABLE MACRO=_VO_CANCEL_COOLDOWN VARIABLE=holding VALUE=1
    SET_GCODE_VARIABLE MACRO=_VO_CANCEL_COOLDOWN VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_vo_cancel_cooldown_check DURATION=1
  {% endif %}

# Runs only between commands, so never inside the cancel; ends the M107 hold in
# case PRINT_END stopped with an error. A print started since keeps its own fan.

[delayed_gcode _vo_cancel_cooldown_check]
gcode:
  {% set cooldown = printer["gcode_macro _VO_CANCEL_COOLDOWN"] %}
  SET_GCODE_VARIABLE MACRO=_VO_CANCEL_COOLDOWN VARIABLE=holding VALUE=0
  {% if cooldown.active %}
    {% if printer.print_stats.state|string in ("printing", "paused") %}
      SET_GCODE_VARIABLE MACRO=_VO_CANCEL_COOLDOWN VARIABLE=active VALUE=0
    {% elif printer[printer.toolhead.extruder].temperature|float < cooldown.fan_off_below|float %}
      M107
    {% else %}
      UPDATE_DELAYED_GCODE ID=_vo_cancel_cooldown_check DURATION=1
    {% endif %}
  {% endif %}

# Replaces QIDI's M107, which the installer removes from klipper-macros-qd/fans.cfg.
# Any M107 outside a cancel ends the cancel's cooldown, as M106 for the part fan
# does (cooling.cfg).

[gcode_macro M107]
description: Turns the part cooling fan off, except during a cancel while the nozzle cools.
gcode:
  {% if not printer["gcode_macro _VO_CANCEL_COOLDOWN"].holding %}
    SET_FAN_SPEED FAN=cooling_fan SPEED=0
    SET_GCODE_VARIABLE MACRO=_VO_CANCEL_COOLDOWN VARIABLE=active VALUE=0
  {% endif %}
